<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Ocean Feast</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div id="start-screen" class="overlay">
        <div class="panel">
          <h1>Ocean Feast</h1>
          <p class="subtitle">Tilt your phone to swim. Eat smaller fish. Avoid the big ones.</p>
          <button id="start-btn" type="button">Start</button>
          <p class="hint">Tap anywhere to swim. Desktop: arrow keys / WASD also work.</p>
        </div>
      </div>

      <div id="hud" class="overlay hidden" aria-hidden="true">
        <div class="hud-bar">
          <span id="score-label">Score: 0</span>
          <span id="size-label">Size: 1.0</span>
        </div>
        <p id="control-hint" class="control-hint">Tilt phone or tap to swim</p>
      </div>

      <div id="gameover-screen" class="overlay hidden" aria-hidden="true">
        <div class="panel">
          <h2>You got eaten!</h2>
          <p id="final-score">Score: 0</p>
          <button id="restart-btn" type="button">Play Again</button>
        </div>
      </div>
    </div>
    <script src="main.js?v=2"></script>
  </body>
</html>
